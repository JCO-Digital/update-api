name: Release

# foonver tags releases from a developer machine (push = true in
# .foonver.toml). Each v* tag gets a GitHub release with the
# jcore-register-plugin binaries attached and its CHANGELOG.md section as notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build jcore-register-plugin
        run: make dist-register VERSION="${TAG#v}"

      # "## v1.2.0 (date)" up to the next "## " heading.
      - name: Release notes
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $TAG." > release-notes.md
          fi
          cat release-notes.md

      # Re-running for a tag replaces the assets instead of failing.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
